<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta name="referrer" content="no-referrer" />
    <title>Essence — Founder review demo</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <a class="skip" href="#main">Đi đến nội dung</a>
    <div class="demo-banner">BẢN DEMO REVIEW — CHỈ DÙNG DỮ LIỆU GIẢ — KHÔNG PHẢI HỆ THỐNG VẬN HÀNH</div>
    <header class="topbar">
      <button class="brand" data-view="overview" aria-label="Về tổng quan">ESSENCE <span>·</span> QUẢN TRỊ</button>
      <div class="topbar-actions"><label class="search"><span class="sr-only">Tìm trong dữ liệu giả</span><input id="demo-search" type="search" autocomplete="off" placeholder="Tìm mã hồ sơ, mã đơn hoặc trạng thái…" /></label><span class="demo-pill">Chỉ dùng dữ liệu giả</span><button class="button button-secondary" data-action="ask-assistant">Hỏi Trợ lý</button><button class="button button-quiet" id="reset-demo">Đặt lại dữ liệu demo</button></div>
    </header>
    <div class="app-shell">
      <button class="mobile-menu button button-quiet" id="mobile-menu" aria-expanded="false">Mở menu</button>
      <aside class="sidebar" id="sidebar" aria-label="Điều hướng demo">
        <p class="eyebrow">KHU VỰC ADMIN</p>
        <nav id="navigation"></nav>
        <div class="sidebar-note"><strong>Đang tắt an toàn</strong><br />Lưu trữ riêng · Xóa thật · Resend · Cal.com · Kích hoạt công khai</div>
      </aside>
      <main id="main" tabindex="-1"></main>
    </div>
    <aside class="assistant-panel" id="assistant-panel" aria-live="polite"></aside>
    <div class="search-results" id="search-results" aria-live="polite"></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="/customer-experience.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
