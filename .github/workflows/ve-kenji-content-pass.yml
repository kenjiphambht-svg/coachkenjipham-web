      - name: Remove one-time workflow and commit
        shell: bash
        run: |
          rm .github/workflows/ve-kenji-content-pass.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/ve-kenji.tsx .github/workflows/ve-kenji-content-pass.yml
          git commit -m "feat: apply Founder-approved ve-kenji content pass"
          git push origin HEAD:feat/ve-kenji-final-content-pass
