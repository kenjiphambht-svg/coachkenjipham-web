name: P07 Advisory Intake Build Evidence

on:
  pull_request:
    branches:
      - main
      - p04/ps-001-advisory-build-01
    paths:
      - 'src/app/api/advisory/**'
      - 'src/lib/advisory/**'
      - 'tests/advisory-intake.test.ts'
      - 'supabase/migrations/20260823151200_p07_b2b_advisory_intake_foundation.sql'
      - 'supabase/migrations/20260823152000_p07_b2b_advisory_intake_hardening.sql'
      - 'supabase/migrations/20260823152500_p07_b2b_advisory_intake_conflict_hardening.sql'
      - 'supabase/migrations/20260823233400_p07_advisory_ops_evidence_a2.sql'
      - 'supabase/rollbacks/20260823151200_p07_b2b_advisory_intake_foundation_down.sql'
      - 'supabase/rollbacks/20260823233400_p07_advisory_ops_evidence_a2_down.sql'
      - 'supabase/tests/p07_b2b_advisory_intake_foundation.sql'
      - 'supabase/tests/p07_b2b_advisory_intake_hardening.sql'
      - 'supabase/tests/p07_advisory_ops_evidence_a2.sql'
      - 'scripts/advisory-ops.mjs'
      - '.github/workflows/p07-advisory-intake-build.yml'

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Assert exact PR head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          echo "EXACT_PR_HEAD=$(git rev-parse HEAD)"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Advisory intake unit contract
        run: npx vitest run tests/advisory-intake.test.ts

      - name: Advisory operator CLI syntax
        run: node --check scripts/advisory-ops.mjs

      - name: Full test suite
        run: npm test

      - name: Next build
        run: npm run build

      - name: Advisory SQL synthetic runtime matrix
        env:
          PGPASSWORD: postgres
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 <<'SQL'
          create role anon nologin;
          create role authenticated nologin;
          create role service_role nologin;
          SQL
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20260823151200_p07_b2b_advisory_intake_foundation.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20260823152000_p07_b2b_advisory_intake_hardening.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20260823152500_p07_b2b_advisory_intake_conflict_hardening.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/tests/p07_b2b_advisory_intake_foundation.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/tests/p07_b2b_advisory_intake_hardening.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20260823233400_p07_advisory_ops_evidence_a2.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/tests/p07_advisory_ops_evidence_a2.sql

      - name: Rollback empty-state contract
        env:
          PGPASSWORD: postgres
        shell: bash
        run: |
          set -euo pipefail
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/rollbacks/20260823233400_p07_advisory_ops_evidence_a2_down.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/rollbacks/20260823151200_p07_b2b_advisory_intake_foundation_down.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -Atc "select to_regclass('crm.advisory_leads') is null;" | grep -qx t

      - name: SQL boundary presence checks
        shell: bash
        run: |
          set -euo pipefail
          foundation='supabase/migrations/20260823151200_p07_b2b_advisory_intake_foundation.sql'
          hardening='supabase/migrations/20260823152000_p07_b2b_advisory_intake_hardening.sql'
          conflict='supabase/migrations/20260823152500_p07_b2b_advisory_intake_conflict_hardening.sql'
          a2='supabase/migrations/20260823233400_p07_advisory_ops_evidence_a2.sql'
          a2rollback='supabase/rollbacks/20260823233400_p07_advisory_ops_evidence_a2_down.sql'
          rollback='supabase/rollbacks/20260823151200_p07_b2b_advisory_intake_foundation_down.sql'
          grep -q 'create table crm.advisory_leads' "$foundation"
          grep -q 'create table crm.advisory_intake_events' "$foundation"
          grep -q 'create table crm.advisory_lifecycle_events' "$foundation"
          grep -q 'ADVISORY_SUBMISSION_CONFLICT' "$foundation"
          grep -q 'revoke all on function public.advisory_intake_register' "$foundation"
          grep -q 'advisory_leads_block_update' "$hardening"
          grep -q 'p_contact_email is null' "$hardening"
          grep -q 'on conflict on constraint advisory_intake_submission_unique' "$conflict"
          grep -q 'actor_reference' "$a2"
          grep -q 'target_reference' "$a2"
          grep -q 'ADVISORY_LIFECYCLE_ACTOR_REQUIRED' "$a2"
          grep -q 'ADVISORY_HANDOFF_TARGET_REQUIRED' "$a2"
          grep -q 'advisory_intake_list_pending' "$a2"
          grep -q 'ADVISORY_A2_ROLLBACK_ADOPTED_EVIDENCE_FORWARD_RECOVERY_REQUIRED' "$a2rollback"
          grep -q 'ADVISORY_ROLLBACK_NONEMPTY_FORWARD_RECOVERY_REQUIRED' "$rollback"
          if grep -Eiq '\b(raw_ip|user_agent|device_fingerprint|phone|budget|payment_data|company_size)\b[[:space:]]+(text|varchar|uuid|json|jsonb|bigint|integer|numeric|boolean|timestamptz)' "$foundation" "$hardening" "$conflict" "$a2"; then
            echo 'Forbidden canonical CRM field detected' >&2
            exit 1
          fi
