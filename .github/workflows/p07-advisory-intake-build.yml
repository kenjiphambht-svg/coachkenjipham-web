name: P07 Advisory Intake Build Evidence

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/app/api/advisory/**'
      - 'src/lib/advisory/**'
      - 'tests/advisory-intake.test.ts'
      - 'supabase/migrations/20260823151200_p07_b2b_advisory_intake_foundation.sql'
      - 'supabase/rollbacks/20260823151200_p07_b2b_advisory_intake_foundation_down.sql'
      - 'supabase/tests/p07_b2b_advisory_intake_foundation.sql'
      - '.github/workflows/p07-advisory-intake-build.yml'

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Assert exact PR head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          echo "EXACT_PR_HEAD=$(git rev-parse HEAD)"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Advisory intake unit contract
        run: npx vitest run tests/advisory-intake.test.ts

      - name: Full test suite
        run: npm test

      - name: Next build
        run: npm run build

      - name: SQL contract presence checks
        shell: bash
        run: |
          set -euo pipefail
          migration='supabase/migrations/20260823151200_p07_b2b_advisory_intake_foundation.sql'
          rollback='supabase/rollbacks/20260823151200_p07_b2b_advisory_intake_foundation_down.sql'
          sqltest='supabase/tests/p07_b2b_advisory_intake_foundation.sql'
          grep -q 'create table crm.advisory_leads' "$migration"
          grep -q 'create table crm.advisory_intake_events' "$migration"
          grep -q 'create table crm.advisory_lifecycle_events' "$migration"
          grep -q 'ADVISORY_SUBMISSION_CONFLICT' "$migration"
          grep -q 'revoke all on function public.advisory_intake_register' "$migration"
          grep -q 'ADVISORY_ROLLBACK_NONEMPTY_FORWARD_RECOVERY_REQUIRED' "$rollback"
          grep -q 'P07_ADVISORY_INTAKE_AT_01_08_PASS' "$sqltest"
          if grep -Eiq '\b(raw_ip|user_agent|device_fingerprint|phone|budget|payment_data|company_size)\b[[:space:]]+(text|varchar|uuid|json|jsonb|bigint|integer|numeric|boolean|timestamptz)' "$migration"; then
            echo 'Forbidden canonical CRM field detected' >&2
            exit 1
          fi
