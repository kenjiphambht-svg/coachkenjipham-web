name: P04 Brand Pack surface visual QA

on:
  push:
    branches:
      - p04/essence-brand-pack-web-implement-01

permissions:
  contents: read

concurrency:
  group: p04-brand-pack-surface-visual-qa
  cancel-in-progress: true

jobs:
  surface-qa:
    if: ${{ contains(github.event.head_commit.message, '[p04-brand-visual-run]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p04/essence-brand-pack-web-implement-01
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked app dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Install ephemeral Playwright QA dependency
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.55.0
          npx playwright install chromium

      - name: Run surface-level responsive and interaction QA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/p04-brand-surface-evidence
          (npm start -- -p 3000 > /tmp/p04-next.log 2>&1 & echo $! > /tmp/p04-next.pid)
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then break; fi
            sleep 1
          done
          cat > p04-brand-surface.spec.cjs <<'JS'
          const { test, expect } = require('@playwright/test');
          const fs = require('fs');
          const out = '/tmp/p04-brand-surface-evidence';
          const base = 'http://127.0.0.1:3000';

          async function settleSurface(page, locator) {
            await locator.scrollIntoViewIfNeeded();
            await page.waitForTimeout(850);
            await expect(locator).toBeVisible();
          }

          async function revealPage(page) {
            const reveals = page.locator('.e26-reveal');
            const count = await reveals.count();
            for (let i = 0; i < count; i += 1) {
              await reveals.nth(i).scrollIntoViewIfNeeded();
              await page.waitForTimeout(190);
            }
            await page.evaluate(() => window.scrollTo({ top: 0, behavior: 'instant' }));
            await page.waitForTimeout(500);
          }

          test('Home full-page desktop and mobile previews', async ({ browser }) => {
            const modes = [
              ['desktop', { width: 1440, height: 1000 }],
              ['mobile', { width: 390, height: 844 }],
            ];
            for (const [mode, viewport] of modes) {
              const page = await browser.newPage({ viewport });
              await page.goto(base + '/', { waitUntil: 'networkidle' });
              await revealPage(page);
              await page.screenshot({ path: `${out}/home-full-${mode}.png`, fullPage: true });
              await page.close();
            }
          });

          test('Founder correction: old Home is ESSENCE Coaching and return corner moved to Master Home', async ({ browser }) => {
            const modes = [
              ['desktop', { width: 1440, height: 1000 }],
              ['mobile', { width: 390, height: 844 }],
            ];

            for (const [mode, viewport] of modes) {
              const home = await browser.newPage({ viewport });
              await home.goto(base + '/', { waitUntil: 'networkidle' });
              await revealPage(home);
              const returnCorner = home.locator('#goc-doc');
              await settleSurface(home, returnCorner);
              await expect(returnCorner.getByText('Một góc để quay lại.')).toBeVisible();
              await expect(returnCorner.getByText('Ebook', { exact: true })).toBeVisible();
              await expect(returnCorner.getByText('Ghi chép Essence', { exact: true })).toBeVisible();
              await expect(returnCorner.getByRole('link', { name: /Khởi đầu/ })).toHaveAttribute('href', '/khoi-dau');
              await expect(home.locator('a[href="/coaching"]').first()).toHaveAttribute('href', '/coaching');
              await returnCorner.screenshot({ path: `${out}/home-return-corner-${mode}.png` });
              await home.close();

              const coaching = await browser.newPage({ viewport });
              const response = await coaching.goto(base + '/coaching', { waitUntil: 'networkidle' });
              expect(response && response.status()).toBe(200);
              await expect(coaching.locator('main')).toBeVisible();
              await expect(coaching.getByText('Câu chuyện cuộc sống của bạn là một kiệt tác.', { exact: false }).first()).toBeVisible();
              await revealPage(coaching);
              await coaching.screenshot({ path: `${out}/coaching-full-${mode}.png`, fullPage: true });
              await coaching.close();
            }
          });

          test('desktop and mobile Brand Pack target surfaces', async ({ browser }) => {
            const modes = [
              ['desktop', { width: 1440, height: 1000 }],
              ['mobile', { width: 390, height: 844 }],
            ];
            for (const [mode, viewport] of modes) {
              const cases = [
                ['home-header', '/', (page) => page.locator('header').first()],
                ['home-ending', '/', (page) => page.locator('section').filter({ hasText: 'Câu chuyện cuộc sống của bạn là một kiệt tác.' }).first()],
                ['ve-kenji-signature', '/ve-kenji', (page) => page.locator('img[src="/brand/essence/32_SIGNATURE_WEB_BLACK.svg"]')],
                ['phuong-phap-shell', '/phuong-phap', (page) => page.locator('header').first()],
                ['advisory-header', '/advisory', (page) => page.locator('header[data-shell="advisory-header-exception"]')],
              ];
              for (const [name, path, locate] of cases) {
                const page = await browser.newPage({ viewport });
                await page.goto(base + path, { waitUntil: 'networkidle' });
                const surface = locate(page);
                await settleSurface(page, surface);
                if (name === 've-kenji-signature') {
                  expect(await surface.evaluate((img) => img.complete && img.naturalWidth > 0 && img.naturalHeight > 0)).toBeTruthy();
                }
                await surface.screenshot({ path: `${out}/${name}-${mode}.png` });
                await page.close();
              }
            }
          });

          test('Home menu follows Founder-locked IA and interaction', async ({ browser }) => {
            const modes = [
              ['desktop', { width: 1440, height: 1000 }],
              ['mobile', { width: 390, height: 844 }],
            ];

            for (const [mode, viewport] of modes) {
              const page = await browser.newPage({ viewport });
              await page.goto(base + '/', { waitUntil: 'networkidle' });
              const menu = page.getByRole('button', { name: 'Menu' });
              await menu.click();
              await expect(menu).toHaveAttribute('aria-expanded', 'true');
              const panel = page.locator('#site-menu-panel');
              await expect(panel).toHaveAttribute('aria-hidden', 'false');
              await expect(panel.locator('a[href="/coaching"]').first()).toBeFocused();
              await expect(panel.locator('a[href="/ban-sac-cua-ban"]')).toHaveCount(1);
              await expect(panel.locator('a[href="/ban-sac-cua-con"]')).toHaveCount(1);
              await expect(panel.locator('a[href="/phuong-phap"]')).toHaveCount(1);
              await expect(panel.locator('a[href="/advisory"]')).toHaveCount(1);
              await expect(panel.locator('a[href="/khoi-dau"]')).toHaveCount(1);
              await expect(panel.locator('a[href="/ve-kenji"]')).toHaveCount(1);
              await expect(panel.locator('a[href="/#goc-doc"]')).toHaveCount(1);
              await expect(panel.locator('a[href="/lien-he"]')).toHaveCount(1);
              await panel.screenshot({ path: `${out}/home-menu-open-${mode}.png` });
              await page.keyboard.press('Escape');
              await expect(menu).toBeFocused();
              await expect(menu).toHaveAttribute('aria-expanded', 'false');
              await page.close();
            }
          });

          test('Home body readability and mobile tap targets remain safe', async ({ browser }) => {
            const page = await browser.newPage({ viewport: { width: 390, height: 844 } });
            await page.goto(base + '/', { waitUntil: 'networkidle' });
            await revealPage(page);

            const bodyBlocks = page.locator('[data-body-copy]');
            expect(await bodyBlocks.count()).toBeGreaterThanOrEqual(7);
            for (let i = 0; i < await bodyBlocks.count(); i += 1) {
              const metrics = await bodyBlocks.nth(i).evaluate((el) => {
                const style = getComputedStyle(el);
                const fontSize = parseFloat(style.fontSize);
                const lineHeight = parseFloat(style.lineHeight);
                return { fontSize, ratio: lineHeight / fontSize };
              });
              expect(metrics.fontSize).toBeGreaterThanOrEqual(16);
              expect(metrics.ratio).toBeGreaterThanOrEqual(1.55);
            }

            for (const href of ['/coaching', '/advisory', '/khoi-dau']) {
              const link = page.locator(`main a[href="${href}"]`).first();
              await link.scrollIntoViewIfNeeded();
              const box = await link.boundingBox();
              expect(box && box.height).toBeGreaterThanOrEqual(44);
            }

            await page.evaluate(() => window.scrollTo({ top: 0, behavior: 'instant' }));
            const menu = page.getByRole('button', { name: 'Menu' });
            const menuBox = await menu.boundingBox();
            expect(menuBox && menuBox.height).toBeGreaterThanOrEqual(44);
            await menu.click();
            const navLinks = page.locator('#site-menu-panel nav a');
            for (let i = 0; i < await navLinks.count(); i += 1) {
              const box = await navLinks.nth(i).boundingBox();
              expect(box && box.height).toBeGreaterThanOrEqual(44);
            }
            await page.close();
          });

          test('Home motion recording shows scroll, threshold response and menu scene', async ({ browser }) => {
            const context = await browser.newContext({
              viewport: { width: 1280, height: 720 },
              recordVideo: { dir: out, size: { width: 1280, height: 720 } },
            });
            const page = await context.newPage();
            const video = page.video();
            await page.goto(base + '/', { waitUntil: 'networkidle' });
            await page.waitForTimeout(700);

            const sections = page.locator('main section');
            const count = await sections.count();
            for (let i = 1; i < count; i += 1) {
              await sections.nth(i).scrollIntoViewIfNeeded();
              await page.waitForTimeout(620);
            }

            const coaching = page.locator('main a[href="/coaching"]').first();
            await coaching.scrollIntoViewIfNeeded();
            await coaching.hover();
            await page.waitForTimeout(700);
            const advisory = page.locator('main a[href="/advisory"]').first();
            await advisory.hover();
            await page.waitForTimeout(700);

            await page.evaluate(() => window.scrollTo({ top: 0, behavior: 'smooth' }));
            await page.waitForTimeout(1000);
            await page.getByRole('button', { name: 'Menu' }).click();
            await page.waitForTimeout(850);
            await page.locator('#site-menu-panel a[href="/advisory"]').hover();
            await page.waitForTimeout(700);
            await page.keyboard.press('Escape');
            await page.waitForTimeout(500);

            await context.close();
            const rawVideo = await video.path();
            fs.renameSync(rawVideo, `${out}/home-motion-desktop.webm`);
          });

          test('Advisory trust bridge remains bounded', async ({ page }) => {
            await page.goto(base + '/advisory', { waitUntil: 'networkidle' });
            const header = page.locator('header[data-shell="advisory-header-exception"]');
            await expect(header).toBeVisible();
            const trust = header.getByRole('link', { name: 'Về Kenji' });
            await expect(trust).toHaveAttribute('href', '/ve-kenji');
            await expect(header.getByRole('button', { name: 'Menu' })).toHaveCount(0);
          });
          JS
          npx playwright test p04-brand-surface.spec.cjs --workers=1 --reporter=line
          rm p04-brand-surface.spec.cjs
          kill "$(cat /tmp/p04-next.pid)" || true
          test "$(find /tmp/p04-brand-surface-evidence -name '*.png' | wc -l)" -eq 18
          test "$(find /tmp/p04-brand-surface-evidence -name '*.webm' | wc -l)" -eq 1

      - uses: actions/upload-artifact@v4
        with:
          name: p04-brand-pack-surface-qa-v2
          path: /tmp/p04-brand-surface-evidence/*
          if-no-files-found: error
